<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BondStats Calendar Health</title>
<style>body{margin:0;background:#050806;color:#f3f7f4;font:14px Inter,system-ui;padding:24px}.box{max-width:850px;margin:auto}.row{display:flex;justify-content:space-between;gap:20px;padding:13px;border-bottom:1px solid #1b2a21}.pass{color:#75e75b}.muted{color:#7f8d84}h1{font-size:28px}</style></head><body><main class="box"><h1>Market Calendar Health</h1><p class="muted" id="meta">Loading…</p><div id="rows"></div></main>
<script>fetch("./data/events.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{document.getElementById("meta").textContent=`${d.events.length} events · generated ${d.meta.generatedAt}`;document.getElementById("rows").innerHTML=(d.sources||[]).map(s=>`<div class="row"><span>${s.name}</span><strong class="pass">${String(s.status).toUpperCase()}</strong></div>`).join("")}).catch(e=>document.getElementById("meta").textContent=e.message)</script></body></html>
