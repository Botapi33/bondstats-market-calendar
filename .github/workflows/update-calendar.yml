name: Update Market Calendar

on:
  workflow_dispatch:
  schedule:
    - cron: '11 */6 * * *'

permissions:
  contents: write

concurrency:
  group: market-calendar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update calendar from official sources
        run: python scripts/update_calendar.py

      - name: Run deterministic tests
        run: python tests/test_calendar.py

      - name: Commit refreshed calendar
        run: |
          if git diff --quiet -- data/events.json; then
            echo "Calendar already current."
            exit 0
          fi

          git config user.name "bondstats-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/events.json
          git commit -m "Update market calendar"
          git push
